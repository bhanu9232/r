<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR File Receiver</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.2/qrcode.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #3fb950;
    --accent-dim: #238636;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; text-align: center; }
  .start-btn {
    padding: 14px 28px;
    background: var(--accent-dim);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  #video-wrap {
    display: none;
    position: relative;
    width: 100%;
    max-width: 420px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  video { width: 100%; display: block; }
  canvas { display: none; }
  .scan-frame {
    position: absolute;
    top: 15%; left: 15%; right: 15%; bottom: 15%;
    border: 2px solid var(--accent);
    border-radius: 8px;
    pointer-events: none;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    width: 100%;
    max-width: 420px;
    margin-top: 16px;
    display: none;
  }
  .row {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .row span.val { color: var(--text); font-weight: 600; }
  .percent-display {
    text-align: center;
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--accent);
    margin: 4px 0 10px;
    font-variant-numeric: tabular-nums;
  }
  .progress-bar {
    width: 100%; height: 8px;
    background: #30363d;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 6px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent-dim);
    width: 0%;
    transition: width 0.15s linear;
  }
  .missing {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 10px;
    word-break: break-all;
  }
  .chunk-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    max-height: 260px;
    overflow-y: auto;
    padding: 8px;
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .chunk-btn {
    width: 34px;
    height: 28px;
    font-size: 0.62rem;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: #21262d;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .chunk-btn.received {
    background: var(--accent-dim);
    color: white;
    border-color: var(--accent);
  }
  .download-btn {
    display: none;
    margin-top: 16px;
    padding: 14px 28px;
    background: var(--accent);
    color: #0d1117;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.95rem;
  }
  .status { font-size: 0.8rem; color: var(--muted); text-align: center; margin-top: 12px; max-width: 420px; }
</style>
</head>
<body>

<h1>QR File Receiver</h1>
<div class="sub">Camera se sender phone ke animated QR codes scan karo.<br>File apne aap reassemble ho jayegi.</div>

<button class="start-btn" id="startBtn">📷 Camera Open Karo</button>

<div id="video-wrap">
  <video id="video" playsinline autoplay muted></video>
  <div class="scan-frame"></div>
</div>

<div class="panel" id="infoPanel">
  <div class="row"><span>File</span><span class="val" id="fName">—</span></div>
  <div class="percent-display" id="percentDisplay">0%</div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="row" style="margin-top:12px"><span>Chunks received</span><span class="val" id="chunkStatus">0 / 0</span></div>
  <div class="row"><span>Data received</span><span class="val" id="dataReceived">0 KB / 0 KB</span></div>

  <div class="row" style="margin-top:14px"><span>Received chunks (sender pe wahi number green karo)</span></div>
  <div id="chunkGrid" class="chunk-grid" style="margin-top:8px;"></div>
</div>

<a id="downloadBtn" class="download-btn" download>⬇ File Download Karo</a>

<div class="status" id="statusMsg"></div>

<script>
const startBtn = document.getElementById('startBtn');
const videoWrap = document.getElementById('video-wrap');
const video = document.getElementById('video');
const infoPanel = document.getElementById('infoPanel');
const chunkGrid = document.getElementById('chunkGrid');
const fName = document.getElementById('fName');
const chunkStatus = document.getElementById('chunkStatus');
const percentDisplay = document.getElementById('percentDisplay');
const dataReceived = document.getElementById('dataReceived');
const progressFill = document.getElementById('progressFill');
const downloadBtn = document.getElementById('downloadBtn');
const statusMsg = document.getElementById('statusMsg');

let meta = null; // {id, totalChunks, name, mime}
let chunks = new Map(); // index -> base64 string
let pendingCombos = []; // repair frames waiting for one side to become known
let scanning = false;
let rafId = null;
let detector = null;

function padBytes(str, len) {
  const arr = new Uint8Array(len);
  for (let i = 0; i < str.length; i++) arr[i] = str.charCodeAt(i);
  return arr;
}
function xorBytesArr(a, b) {
  const out = new Uint8Array(a.length);
  for (let i = 0; i < a.length; i++) out[i] = a[i] ^ b[i];
  return out;
}
function bytesToStr(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return s;
}
function base64ToBytes(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

function storeChunk(idx, str) {
  if (chunks.has(idx)) return;
  chunks.set(idx, str);
  markChunkGreen(idx);
  updateProgress();
  sweepPending();
}

// try to resolve a repair (XOR) frame: if we already know one of the two
// chunks it combines, algebraically recover the other one instantly —
// no need to wait for that exact original frame to loop back around.
function tryResolveCombo(c) {
  const haveA = chunks.has(c.idxA);
  const haveB = chunks.has(c.idxB);
  if (haveA && haveB) return true; // nothing left to learn from this one
  if (!haveA && !haveB) return false; // keep waiting
  const knownIdx = haveA ? c.idxA : c.idxB;
  const unknownIdx = haveA ? c.idxB : c.idxA;
  const unknownLen = haveA ? c.lenB : c.lenA;
  const knownPadded = padBytes(chunks.get(knownIdx), c.padLen);
  const recoveredPadded = xorBytesArr(c.xorBytes, knownPadded);
  const recoveredStr = bytesToStr(recoveredPadded.slice(0, unknownLen));
  storeChunk(unknownIdx, recoveredStr);
  return true;
}

function sweepPending() {
  let changed = true;
  while (changed) {
    changed = false;
    for (let i = pendingCombos.length - 1; i >= 0; i--) {
      if (tryResolveCombo(pendingCombos[i])) {
        pendingCombos.splice(i, 1);
        changed = true;
      }
    }
  }
}

startBtn.onclick = async () => {
  if (!('BarcodeDetector' in window)) {
    statusMsg.textContent = '⚠️ Ye browser QR scanning support nahi karta. Android par latest Chrome / Edge use karo.';
    return;
  }
  try {
    detector = new BarcodeDetector({ formats: ['qr_code'] });
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    video.srcObject = stream;
    videoWrap.style.display = 'block';
    startBtn.style.display = 'none';
    scanning = true;
    statusMsg.textContent = 'QR code ko frame ke andar rakho...';
    video.onloadedmetadata = () => {
      tick();
    };
  } catch (err) {
    statusMsg.textContent = 'Camera access nahi mil paya: ' + err.message;
  }
};

async function tick() {
  if (!scanning) return;
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    try {
      const codes = await detector.detect(video);
      for (const code of codes) {
        if (code && code.rawValue) handleFrame(code.rawValue);
      }
    } catch (e) {
      // detection hiccup on a frame — ignore and keep scanning
    }
  }
  rafId = requestAnimationFrame(tick);
}

function handleFrame(data) {
  const parts = data.split('|');
  if (parts[0] === 'M') {
    const [, id, totalChunks, name, mime, size] = parts;
    if (!meta || meta.id !== id) {
      meta = { id, totalChunks: parseInt(totalChunks, 10), name: decodeURIComponent(name), mime, size: size ? parseInt(size, 10) : null };
      chunks = new Map();
      pendingCombos = [];
      infoPanel.style.display = 'block';
      fName.textContent = meta.name;
      renderChunkGrid();
      updateProgress();
    } else if (meta.size == null && size) {
      meta.size = parseInt(size, 10);
    }
  } else if (parts[0] === 'D') {
    const [, id, idxStr, totalStr, chunkData] = parts;
    if (!meta) {
      // data frame arrived before meta frame — create provisional meta
      meta = { id, totalChunks: parseInt(totalStr, 10), name: 'received_file', mime: 'application/octet-stream' };
      infoPanel.style.display = 'block';
      fName.textContent = meta.name;
      renderChunkGrid();
    }
    if (meta.id !== id) return; // frame from a different transfer, ignore
    storeChunk(parseInt(idxStr, 10), chunkData);
  } else if (parts[0] === 'X') {
    const [, id, totalStr, idxAStr, idxBStr, lenAStr, lenBStr, padLenStr, b64xor] = parts;
    if (!meta) {
      meta = { id, totalChunks: parseInt(totalStr, 10), name: 'received_file', mime: 'application/octet-stream' };
      infoPanel.style.display = 'block';
      fName.textContent = meta.name;
      renderChunkGrid();
    }
    if (meta.id !== id) return;
    const combo = {
      idxA: parseInt(idxAStr, 10), idxB: parseInt(idxBStr, 10),
      lenA: parseInt(lenAStr, 10), lenB: parseInt(lenBStr, 10),
      padLen: parseInt(padLenStr, 10), xorBytes: base64ToBytes(b64xor)
    };
    if (!tryResolveCombo(combo)) {
      pendingCombos.push(combo);
      if (pendingCombos.length > 80) pendingCombos.shift();
    }
  }

  if (meta && chunks.size === meta.totalChunks) {
    finishTransfer();
  }
}

function updateProgress() {
  if (!meta) return;
  const pct = meta.totalChunks ? (chunks.size / meta.totalChunks) * 100 : 0;
  chunkStatus.textContent = `${chunks.size} / ${meta.totalChunks}`;
  percentDisplay.textContent = `${Math.round(pct)}%`;
  progressFill.style.width = `${pct}%`;

  // received data size: sum of base64 chars actually collected, converted to approx raw bytes
  let receivedBase64Chars = 0;
  chunks.forEach(c => receivedBase64Chars += c.length);
  const receivedBytes = Math.floor(receivedBase64Chars * 3 / 4);
  const totalLabel = meta.size != null ? formatBytes(meta.size) : '—';
  dataReceived.textContent = `${formatBytes(receivedBytes)} / ${totalLabel}`;
}

function renderChunkGrid() {
  if (!meta) return;
  let html = '';
  for (let i = 0; i < meta.totalChunks; i++) {
    html += `<button class="chunk-btn" data-idx="${i}">${i}</button>`;
  }
  chunkGrid.innerHTML = html;
}

function markChunkGreen(idx) {
  const btn = chunkGrid.querySelector(`[data-idx="${idx}"]`);
  if (btn) btn.classList.add('received');
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}

function finishTransfer() {
  scanning = false;
  if (rafId) cancelAnimationFrame(rafId);
  const stream = video.srcObject;
  if (stream) stream.getTracks().forEach(t => t.stop());
  videoWrap.style.display = 'none';

  let base64 = '';
  for (let i = 0; i < meta.totalChunks; i++) {
    base64 += chunks.get(i) || '';
  }

  try {
    const byteChars = atob(base64);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], { type: meta.mime });
    const url = URL.createObjectURL(blob);
    downloadBtn.href = url;
    downloadBtn.download = meta.name;
    downloadBtn.style.display = 'inline-block';
    statusMsg.textContent = '✅ File poori tarah receive ho gayi!';
  } catch (e) {
    statusMsg.textContent = 'Reassemble karte waqt error aayi: ' + e.message;
  }
}
</script>

</body>
  </html>
