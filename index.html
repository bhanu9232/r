<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Node</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.2/qrcode.min.js"></script>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #3fb950; --accent-dim: #238636;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 60px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; text-align: center; }
  
  .app-container { display: flex; flex-direction: column; width: 100%; max-width: 420px; gap: 16px; align-items: center; }
  body.pc-mode .app-container { flex-direction: row; max-width: 1000px; align-items: flex-start; justify-content: center; }
  body.pc-mode .panel-col { width: 420px; flex-shrink: 0; }
  body.pc-mode .qr-col { flex-grow: 1; max-width: 500px; width: 100%; }
  
  .top-bar { display: flex; justify-content: space-between; width: 100%; max-width: 420px; margin-bottom: 20px; }
  body.pc-mode .top-bar { max-width: 1000px; }
  
  button.action-btn {
    padding: 12px 20px; background: var(--accent-dim); color: white; border: none;
    border-radius: 8px; font-weight: 600; cursor: pointer; text-align: center; font-size: 0.9rem;
  }
  button.action-btn:active { background: var(--accent); }
  button.secondary-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
  
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px; width: 100%; margin-bottom: 16px;
  }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 0.85rem; color: var(--muted); }
  .row span.val { color: var(--text); font-weight: 600; }
  
  #qr-stage, #video-wrap {
    background: white; border-radius: 12px; padding: 16px; display: none;
    flex-direction: column; align-items: center; width: 100%; position: relative;
  }
  #video-wrap { padding: 0; overflow: hidden; background: #000; border: 1px solid var(--border); }
  #qr-canvas-wrap { display: grid; gap: 6px; width: 100%; }
  #qr-canvas-wrap img { width: 100%; height: auto; display: block; image-rendering: pixelated; }
  video { width: 100%; display: block; }
  .scan-frame { position: absolute; top: 15%; left: 15%; right: 15%; bottom: 15%; border: 2px solid var(--accent); border-radius: 8px; pointer-events: none; }
  
  .progress-bar { width: 100%; height: 6px; background: #e5e5e5; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  #video-wrap .progress-bar { background: #30363d; margin: 10px; width: calc(100% - 20px); }
  .progress-fill { height: 100%; background: var(--accent-dim); width: 0%; transition: width 0.1s linear; }
  .percent-display { text-align: center; font-size: 2.2rem; font-weight: 700; color: var(--accent); margin: 4px 0 10px; }
  
  .chunk-grid {
    display: flex; flex-wrap: wrap; gap: 4px; max-height: 260px; overflow-y: auto; padding: 8px;
    background: #0d1117; border: 1px solid var(--border); border-radius: 8px; user-select: none;
  }
  .chunk-btn {
    width: 34px; height: 28px; font-size: 0.62rem; border-radius: 4px; border: 1px solid var(--border);
    background: #21262d; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .chunk-btn.received { background: var(--accent-dim); color: white; border-color: var(--accent); }
  
  .sync-box { display: flex; gap: 8px; margin-top: 8px; }
  .sync-input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: #0d1117; color: var(--text); font-family: monospace; font-size: 1.05rem; letter-spacing: 0.12em; text-transform: uppercase; }
  #syncOutput { color: var(--accent); font-weight: 700; text-align: center; }
  
  .status { font-size: 0.8rem; color: var(--muted); text-align: center; margin-top: 10px; }
  .hidden { display: none !important; }
</style>
</head>
<body class="mobile-mode">

<div class="top-bar">
  <button class="action-btn secondary-btn" id="homeBtn">⬅ Back</button>
  <div style="display:flex; gap:8px;">
    <button class="action-btn secondary-btn" id="dlSourceBtn" title="Download Code as TXT">💾 .TXT</button>
    <button class="action-btn secondary-btn" id="viewToggleBtn">💻 PC View</button>
  </div>
</div>

<div id="mainMenu" style="display:flex; flex-direction:column; gap:20px; align-items:center; margin-top: 50px;">
  <h1>QR Node</h1>
  <div class="sub">Offline synchronization portal</div>
  <button class="action-btn" style="width: 250px; padding: 20px; font-size: 1.1rem;" onclick="startApp('host')">📤 Host Payload</button>
  <button class="action-btn" style="width: 250px; padding: 20px; font-size: 1.1rem;" onclick="startApp('join')">📥 Join Payload</button>
</div>

<div id="hostUI" class="app-container hidden">
  <div class="panel-col">
    <div class="panel">
      <button class="action-btn" id="browseBtn" style="width:100%">📁 Select Payload</button>
      <input type="file" id="dataInput" class="hidden">
      
      <div id="hostMeta" class="hidden">
        <div class="row"><span>Name</span><span class="val" id="s-itemName">—</span></div>
        <div class="row"><span>Size</span><span class="val" id="s-itemSize">—</span></div>
        <div class="row"><span>Total Frames</span><span class="val" id="s-chunkCount">—</span></div>
        
        <div class="row" style="margin-top:16px;"><span>Speed</span>
          <input type="range" id="speedSlider" min="2" max="15" value="4" style="flex:1; margin:0 10px;">
          <span class="val" id="speedVal">4 fps</span>
        </div>
        <div class="row" style="margin-top:10px;"><span>Grid Size</span>
          <select id="gridSelect" style="background:#0d1117; color:var(--text); border:1px solid var(--border); border-radius:6px; padding:4px;">
            <option value="1">1 (Max Reliability)</option>
            <option value="4" selected>4 (2×2)</option>
            <option value="6">6 (2×3)</option>
            <option value="9">9 (3×3)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="panel hidden" id="hostControlPanel">
      <div style="display:flex; gap:8px; margin-bottom: 12px;">
        <button class="action-btn secondary-btn" id="pauseBtn" style="flex:1">⏸ Pause</button>
        <button class="action-btn secondary-btn" id="restartBtn" style="flex:1">⟲ Restart</button>
      </div>
      
      <div class="row"><span>Select completed chunks (Click & Drag)</span></div>
      <div id="host-chunkGrid" class="chunk-grid"></div>
      
      <div class="row" style="margin-top:16px;"><span>Auto-Sync from Node</span></div>
      <div class="sync-box">
        <input type="text" id="syncInput" class="sync-input" placeholder="Paste Sync Key here...">
        <button class="action-btn" id="applySyncBtn">Apply</button>
      </div>
      
      <div class="status" id="s-statusMsg"></div>
    </div>
  </div>

  <div class="qr-col">
    <div id="qr-stage">
      <div id="qr-canvas-wrap"></div>
      <div style="color:#111; font-size:0.8rem; margin-top:10px; font-weight:600;" id="frameLabel">—</div>
      <div class="progress-bar"><div class="progress-fill" id="s-progressFill"></div></div>
    </div>
  </div>
</div>

<div id="joinUI" class="app-container hidden">
  <div class="panel-col">
    <button class="action-btn" id="startCamBtn" style="width:100%; margin-bottom:16px;">📷 Open Camera</button>
    
    <div id="video-wrap">
      <video id="video" playsinline autoplay muted></video>
      <div class="scan-frame"></div>
    </div>

    <div class="panel hidden" id="joinPanel">
      <div class="percent-display" id="percentDisplay">0%</div>
      <div class="progress-bar" style="background:#30363d; margin-top:0;"><div class="progress-fill" id="r-progressFill"></div></div>
      
      <div class="row" style="margin-top:12px"><span>Name</span><span class="val" id="r-itemName">—</span></div>
      <div class="row"><span>Chunks Synchronized</span><span class="val" id="r-chunkStatus">0 / 0</span></div>
      <div class="row"><span>Data Synchronized</span><span class="val" id="r-dataReceived">0 KB</span></div>
      
      <div class="row" style="margin-top:16px;"><span>Offline Sync Key (Give to Host)</span></div>
      <div class="sync-box">
        <input type="text" id="syncOutput" class="sync-input" readonly>
        <button class="action-btn secondary-btn" id="genSyncBtn" title="Generate a new/next code">🔄</button>
        <button class="action-btn" id="copySyncBtn">Copy</button>
      </div>

      <div class="row" style="margin-top:16px;"><span>Chunk Map</span></div>
      <div id="join-chunkGrid" class="chunk-grid" style="max-height: 150px;"></div>
      
      <a id="saveBtn" class="action-btn hidden" style="width:100%; margin-top:16px; text-decoration:none;" download>⬇ Save Output</a>
      <div class="status" id="r-statusMsg">Waiting for frames...</div>
    </div>
  </div>
</div>

<script>
const body = document.body;
const viewToggleBtn = document.getElementById('viewToggleBtn');
const homeBtn = document.getElementById('homeBtn');
const dlSourceBtn = document.getElementById('dlSourceBtn');
const mainMenu = document.getElementById('mainMenu');
const hostUI = document.getElementById('hostUI');
const joinUI = document.getElementById('joinUI');

viewToggleBtn.onclick = () => {
  if (body.classList.contains('mobile-mode')) {
    body.classList.replace('mobile-mode', 'pc-mode');
    viewToggleBtn.textContent = '📱 Mobile View';
  } else {
    body.classList.replace('pc-mode', 'mobile-mode');
    viewToggleBtn.textContent = '💻 PC View';
  }
};

homeBtn.onclick = () => {
  hostUI.classList.add('hidden');
  joinUI.classList.add('hidden');
  mainMenu.classList.remove('hidden');
  if(JoinApp.scanning || HostApp.timer) window.location.reload(); 
};

dlSourceBtn.onclick = () => {
  const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  const blob = new Blob([htmlContent], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "qr-node.txt";
  a.click();
  URL.revokeObjectURL(url);
};

function startApp(mode) {
  mainMenu.classList.add('hidden');
  if (mode === 'host') {
    hostUI.classList.remove('hidden');
  } else {
    joinUI.classList.remove('hidden');
  }
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}

/* =========================================================================
   SYNC CODE — always exactly 8 characters, regardless of file size.
   A raw bitmap can't fit in 8 chars once a file has more than ~30 chunks,
   so instead of listing every chunk, the code carries a compact
   "mixed-radix" packed number: 1 bit for which set it's describing
   (received vs missing — whichever is smaller), 1 bit for whether the
   list is the FULL set or just a sample, a small count, and up to M
   chunk indices — where M is computed from the file's chunk count so the
   packed number always fits in the alphabet's 8-character capacity.
   For files where M can't hold every remaining index in one code, the
   window of indices shown rotates over time (every 10s) so repeated
   codes eventually cover the whole file — this matters most near the
   end of a transfer, when few chunks are actually missing and the full
   set usually DOES fit in one code.
   ========================================================================= */
const SYNC_ALPHABET = "0123456789ABCDEFGHJKMNPQRSTUVWXYZ-_*+#@"; // no O/I/L to avoid look-alikes with 0/1
const SYNC_BASE = SYNC_ALPHABET.length;
const SYNC_CODE_LEN = 8;
const SYNC_CODE_LIMIT = Math.pow(SYNC_BASE, SYNC_CODE_LEN);

function syncToBaseN(value) {
  let out = '';
  let v = value;
  if (v === 0) return SYNC_ALPHABET[0].repeat(SYNC_CODE_LEN);
  while (v > 0) {
    out = SYNC_ALPHABET[v % SYNC_BASE] + out;
    v = Math.floor(v / SYNC_BASE);
  }
  return out.padStart(SYNC_CODE_LEN, SYNC_ALPHABET[0]);
}
function syncFromBaseN(str) {
  let v = 0;
  for (const ch of str.toUpperCase()) {
    const digit = SYNC_ALPHABET.indexOf(ch);
    if (digit === -1) return null;
    v = v * SYNC_BASE + digit;
  }
  return v;
}
function syncMaxSlotsFor(totalChunks) {
  let M = 0;
  while (4 * (M + 2) * Math.pow(totalChunks, M + 1) <= SYNC_CODE_LIMIT) M++;
  return M;
}
function syncEncode(totalChunks, mode, isComplete, chosenIndices) {
  const M = syncMaxSlotsFor(totalChunks);
  const count = Math.min(chosenIndices.length, M);
  let value = mode;
  value = value * 2 + isComplete;
  value = value * (M + 1) + count;
  for (let i = 0; i < M; i++) {
    const idx = i < count ? chosenIndices[i] : 0;
    value = value * totalChunks + idx;
  }
  return syncToBaseN(value);
}
function syncDecode(code, totalChunks) {
  const M = syncMaxSlotsFor(totalChunks);
  let value = syncFromBaseN(code.trim());
  if (value === null) return null;
  const idx = new Array(M);
  for (let i = M - 1; i >= 0; i--) {
    idx[i] = value % totalChunks;
    value = Math.floor(value / totalChunks);
  }
  const count = value % (M + 1);
  value = Math.floor(value / (M + 1));
  const isComplete = value % 2;
  value = Math.floor(value / 2);
  const mode = value % 2;
  return { mode, isComplete, count, indices: idx.slice(0, count) };
}

// Pure: computes the code for a GIVEN offset without mutating anything.
// Also returns how big the full candidate list is and how many slots (M)
// fit per code, so the caller can decide the next offset itself.
function computeSyncWindow(total, chunksMap, offset) {
  if (!total) return { code: '', fullListLength: 0, M: 0 };
  const receivedCount = chunksMap.size;
  const missingCount = total - receivedCount;
  const useMissing = missingCount <= receivedCount;
  const fullList = [];
  if (useMissing) { for (let i = 0; i < total; i++) if (!chunksMap.has(i)) fullList.push(i); }
  else { for (let i = 0; i < total; i++) if (chunksMap.has(i)) fullList.push(i); }

  const M = syncMaxSlotsFor(total);
  let chosen, isComplete;
  if (fullList.length <= M) {
    chosen = fullList;
    isComplete = 1;
  } else {
    isComplete = 0;
    chosen = [];
    if (M > 0) {
      const off = ((offset % fullList.length) + fullList.length) % fullList.length;
      for (let k = 0; k < M; k++) chosen.push(fullList[(off + k) % fullList.length]);
    }
  }
  const code = syncEncode(total, useMissing ? 1 : 0, isComplete, chosen);
  return { code, fullListLength: fullList.length, M };
}

// Convenience: code for the CURRENT window, no state change. Safe to call
// as often as needed (e.g. every time a new chunk arrives).
function generateSyncCode(total, chunksMap, rotationState) {
  return computeSyncWindow(total, chunksMap, rotationState.offset).code;
}

// Applies a code the HOST side received: merges new info into excludedIndices
// (chunks confirmed as no longer needing to be sent). Never removes prior
// knowledge, since "received" is monotonic and never reverses.
function applySyncCode(code, total, excludedIndices) {
  const decoded = syncDecode(code, total);
  if (!decoded) return { ok: false, updated: 0 };
  let updated = 0;
  if (decoded.mode === 0) {
    decoded.indices.forEach(i => { if (!excludedIndices.has(i)) { excludedIndices.add(i); updated++; } });
  } else if (decoded.isComplete) {
    const missingSet = new Set(decoded.indices);
    for (let i = 0; i < total; i++) {
      if (!missingSet.has(i) && !excludedIndices.has(i)) { excludedIndices.add(i); updated++; }
    }
  }
  return { ok: true, updated, allDone: decoded.mode === 1 && decoded.isComplete && decoded.indices.length === 0 };
}

const HostApp = {
  CHUNK_SIZE: 700, gId: '', gTotalChunks: 0, gMetaStr: '', gChunkStrs: [],
  excludedIndices: new Set(), currentPass: [], currentIdx: 0, timer: null, paused: false,
  
  init() {
    document.getElementById('browseBtn').onclick = () => document.getElementById('dataInput').click();
    document.getElementById('dataInput').onchange = (e) => this.processSelection(e);
    document.getElementById('speedSlider').oninput = (e) => {
      document.getElementById('speedVal').textContent = `${e.target.value} fps`;
      if (this.currentPass.length) this.startLoop();
    };
    document.getElementById('gridSelect').onchange = () => { this.currentIdx = 0; if (this.currentPass.length) this.startLoop(); };
    document.getElementById('pauseBtn').onclick = () => this.togglePause();
    document.getElementById('restartBtn').onclick = () => { this.currentIdx = 0; this.paused = false; document.getElementById('pauseBtn').textContent = '⏸ Pause'; };
    
    document.getElementById('applySyncBtn').onclick = () => {
      const code = document.getElementById('syncInput').value.trim();
      const statusEl = document.getElementById('s-statusMsg');
      if (!code) return;
      if (!this.gTotalChunks) { statusEl.textContent = 'Pehle payload select karo.'; return; }
      const result = applySyncCode(code, this.gTotalChunks, this.excludedIndices);
      if (!result.ok) { statusEl.textContent = '⚠️ Invalid Sync Key.'; return; }
      this.refreshGridVisuals();
      this.refreshPass();
      statusEl.textContent = result.allDone
        ? '✅ Node ke paas sab chunks already hain!'
        : (result.updated > 0 ? `✅ ${result.updated} chunks synced.` : 'Synced — no new chunks in this key.');
      document.getElementById('syncInput').value = '';
    };

    this.setupDragSelect();
  },

  processSelection(e) {
    const item = e.target.files[0];
    if (!item) return;
    const reader = new FileReader();
    reader.onload = () => this.buildData(item, reader.result.split(',')[1]);
    reader.readAsDataURL(item);
  },

  buildData(item, base64) {
    this.gId = Math.random().toString(36).slice(2, 8);
    this.gTotalChunks = Math.ceil(base64.length / this.CHUNK_SIZE);
    this.gChunkStrs = [];
    for (let i = 0; i < this.gTotalChunks; i++) this.gChunkStrs.push(base64.slice(i * this.CHUNK_SIZE, (i + 1) * this.CHUNK_SIZE));
    this.gMetaStr = `M|${this.gId}|${this.gTotalChunks}|${encodeURIComponent(item.name)}|${item.type || 'application/octet-stream'}|${item.size}`;
    
    this.excludedIndices.clear();
    this.renderGridHTML();
    
    document.getElementById('hostMeta').classList.remove('hidden');
    document.getElementById('hostControlPanel').classList.remove('hidden');
    document.getElementById('qr-stage').style.display = 'flex';
    
    document.getElementById('s-itemName').textContent = item.name;
    document.getElementById('s-itemSize').textContent = formatBytes(item.size);
    document.getElementById('s-chunkCount').textContent = this.gTotalChunks;
    
    this.refreshPass();
    this.startLoop();
  },

  buildPassFrames() {
    const pool = [...Array(this.gTotalChunks).keys()].filter(i => !this.excludedIndices.has(i));
    const order = pool.sort(() => Math.random() - 0.5);
    const pass = [this.gMetaStr];
    order.forEach((idx, n) => {
      pass.push(`D|${this.gId}|${idx}|${this.gTotalChunks}|${this.gChunkStrs[idx]}`);
      if ((n + 1) % 8 === 0) pass.push(this.gMetaStr);
    });
    if (pass.length === 1) pass.push(this.gMetaStr);
    return pass;
  },

  startLoop() {
    clearInterval(this.timer);
    const fps = parseInt(document.getElementById('speedSlider').value, 10);
    const gridSize = parseInt(document.getElementById('gridSelect').value, 10);
    this.timer = setInterval(() => {
      if (this.paused) return;
      if (this.currentIdx >= this.currentPass.length) { this.currentPass = this.buildPassFrames(); this.currentIdx = 0; }
      const batch = this.currentPass.slice(this.currentIdx, this.currentIdx + gridSize);
      this.renderQR(batch);
      this.currentIdx += batch.length;
    }, 1000 / fps);
  },

  renderQR(dataArr) {
    let html = '';
    dataArr.forEach(data => {
      const qr = qrcode(0, 'M'); qr.addData(data); qr.make(); html += qr.createImgTag(3, 4);
    });
    const wrap = document.getElementById('qr-canvas-wrap');
    wrap.innerHTML = html;
    wrap.style.gridTemplateColumns = `repeat(${Math.ceil(Math.sqrt(dataArr.length))}, 1fr)`;
    
    const pct = ((this.currentIdx + dataArr.length) / this.currentPass.length) * 100;
    document.getElementById('s-progressFill').style.width = `${pct}%`;
    document.getElementById('frameLabel').textContent = `Showing ${dataArr.length} codes — Loop ${this.currentIdx + dataArr.length} / ${this.currentPass.length}`;
  },

  refreshPass() {
    this.currentPass = this.buildPassFrames();
    this.currentIdx = 0;
    if (this.excludedIndices.size >= this.gTotalChunks) {
      this.paused = true; document.getElementById('s-statusMsg').textContent = '✅ All chunks sent!';
    } else {
      this.paused = false; document.getElementById('s-statusMsg').textContent = `${this.gTotalChunks - this.excludedIndices.size} chunks remaining...`;
    }
  },

  togglePause() {
    this.paused = !this.paused;
    document.getElementById('pauseBtn').textContent = this.paused ? '▶ Resume' : '⏸ Pause';
  },

  setupDragSelect() {
    const grid = document.getElementById('host-chunkGrid');
    let isDragging = false, setMode = false;
    
    grid.addEventListener('mousedown', (e) => {
      if (e.target.classList.contains('chunk-btn')) {
        isDragging = true;
        const idx = parseInt(e.target.dataset.idx, 10);
        setMode = !this.excludedIndices.has(idx);
        this.toggleChunk(idx, setMode, e.target);
      }
    });
    grid.addEventListener('mouseover', (e) => {
      if (isDragging && e.target.classList.contains('chunk-btn')) {
        this.toggleChunk(parseInt(e.target.dataset.idx, 10), setMode, e.target);
      }
    });
    window.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; this.refreshPass(); }});
  },
  
  toggleChunk(idx, mode, btn) {
    if (mode) { this.excludedIndices.add(idx); btn.classList.add('received'); }
    else { this.excludedIndices.delete(idx); btn.classList.remove('received'); }
  },

  renderGridHTML() {
    let html = '';
    for (let i = 0; i < this.gTotalChunks; i++) html += `<button class="chunk-btn" data-idx="${i}">${i}</button>`;
    document.getElementById('host-chunkGrid').innerHTML = html;
  },
  
  refreshGridVisuals() {
    document.querySelectorAll('#host-chunkGrid .chunk-btn').forEach(btn => {
      if (this.excludedIndices.has(parseInt(btn.dataset.idx, 10))) btn.classList.add('received');
      else btn.classList.remove('received');
    });
  }
};
HostApp.init();

const JoinApp = {
  meta: null, chunks: new Map(), scanning: false, rafId: null, detector: null, video: null,
  syncRotation: { offset: 0 },

  refreshSyncCode() {
    if (!this.meta) return;
    document.getElementById('syncOutput').value = generateSyncCode(this.meta.total, this.chunks, this.syncRotation);
  },
  showInitialSyncCode() {
    this.syncRotation.offset = 0;
    this.refreshSyncCode();
  },
  generateNextSyncCode() {
    if (!this.meta) return;
    const win = computeSyncWindow(this.meta.total, this.chunks, this.syncRotation.offset);
    if (win.M > 0 && win.fullListLength > 0) {
      this.syncRotation.offset = (this.syncRotation.offset + win.M) % win.fullListLength;
    }
    this.refreshSyncCode();
    const btn = document.getElementById('genSyncBtn');
    btn.textContent = '✓';
    setTimeout(() => { btn.textContent = '🔄'; }, 400);
  },
  
  init() {
    this.video = document.getElementById('video');
    document.getElementById('startCamBtn').onclick = () => this.startCam();
    document.getElementById('genSyncBtn').onclick = () => this.generateNextSyncCode();
    document.getElementById('copySyncBtn').onclick = () => {
      const out = document.getElementById('syncOutput');
      out.select(); document.execCommand('copy');
      document.getElementById('copySyncBtn').textContent = "Copied!";
      setTimeout(() => document.getElementById('copySyncBtn').textContent = "Copy", 2000);
    };
  },

  async startCam() {
    if (!('BarcodeDetector' in window)) return alert('Browser does not support native QR scanning.');
    try {
      this.detector = new BarcodeDetector({ formats: ['qr_code'] });
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      this.video.srcObject = stream;
      document.getElementById('video-wrap').style.display = 'block';
      document.getElementById('startCamBtn').classList.add('hidden');
      this.scanning = true;
      this.video.onloadedmetadata = () => this.tick();
    } catch (err) { alert('Camera error: ' + err.message); }
  },

  async tick() {
    if (!this.scanning) return;
    if (this.video.readyState === this.video.HAVE_ENOUGH_DATA) {
      try {
        const codes = await this.detector.detect(this.video);
        for (const code of codes) if (code && code.rawValue) this.handleFrame(code.rawValue);
      } catch (e) {}
    }
    this.rafId = requestAnimationFrame(() => this.tick());
  },

  handleFrame(data) {
    const parts = data.split('|');
    if (parts[0] === 'M') {
      const [, id, tChunks, name, mime, size] = parts;
      if (!this.meta || this.meta.id !== id) {
        this.meta = { id, total: parseInt(tChunks, 10), name: decodeURIComponent(name), mime, size: parseInt(size, 10) };
        this.chunks.clear();
        document.getElementById('joinPanel').classList.remove('hidden');
        document.getElementById('r-itemName').textContent = this.meta.name;
        this.renderGridHTML();
        this.showInitialSyncCode();
      }
    } else if (parts[0] === 'D') {
      const [, id, idxStr, , chunkData] = parts;
      if (!this.meta || this.meta.id !== id) return;
      const idx = parseInt(idxStr, 10);
      if (!this.chunks.has(idx)) {
        this.chunks.set(idx, chunkData);
        const btn = document.querySelector(`#join-chunkGrid .chunk-btn[data-idx="${idx}"]`);
        if (btn) btn.classList.add('received');
        this.updateProgress();
      }
    }
    if (this.meta && this.chunks.size === this.meta.total) this.finishTask();
  },

  updateProgress() {
    const pct = (this.chunks.size / this.meta.total) * 100;
    document.getElementById('r-chunkStatus').textContent = `${this.chunks.size} / ${this.meta.total}`;
    document.getElementById('percentDisplay').textContent = `${Math.round(pct)}%`;
    document.getElementById('r-progressFill').style.width = `${pct}%`;
    
    this.refreshSyncCode();
    
    let receivedChars = 0; this.chunks.forEach(c => receivedChars += c.length);
    document.getElementById('r-dataReceived').textContent = `${formatBytes(receivedChars * 0.75)} / ${formatBytes(this.meta.size)}`;
  },

  renderGridHTML() {
    let html = '';
    for (let i = 0; i < this.meta.total; i++) html += `<button class="chunk-btn" data-idx="${i}">${i}</button>`;
    document.getElementById('join-chunkGrid').innerHTML = html;
  },

  finishTask() {
    this.scanning = false;
    cancelAnimationFrame(this.rafId);
    this.video.srcObject.getTracks().forEach(t => t.stop());
    document.getElementById('video-wrap').style.display = 'none';

    let base64 = '';
    for (let i = 0; i < this.meta.total; i++) base64 += this.chunks.get(i) || '';
    try {
      const bin = atob(base64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([arr], { type: this.meta.mime }));
      const dBtn = document.getElementById('saveBtn');
      dBtn.href = url; dBtn.download = this.meta.name;
      dBtn.classList.remove('hidden');
      document.getElementById('r-statusMsg').textContent = '✅ Output generated!';
    } catch (e) { document.getElementById('r-statusMsg').textContent = 'Error: ' + e.message; }
  }
};
JoinApp.init();

</script>
