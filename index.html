<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR File Receiver</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #3fb950;
    --accent-dim: #238636;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; text-align: center; }
  .start-btn {
    padding: 14px 28px;
    background: var(--accent-dim);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  #video-wrap {
    display: none;
    position: relative;
    width: 100%;
    max-width: 420px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  video { width: 100%; display: block; }
  canvas { display: none; }
  .scan-frame {
    position: absolute;
    top: 15%; left: 15%; right: 15%; bottom: 15%;
    border: 2px solid var(--accent);
    border-radius: 8px;
    pointer-events: none;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    width: 100%;
    max-width: 420px;
    margin-top: 16px;
    display: none;
  }
  .row {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .row span.val { color: var(--text); font-weight: 600; }
  .progress-bar {
    width: 100%; height: 8px;
    background: #30363d;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 6px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent-dim);
    width: 0%;
    transition: width 0.15s linear;
  }
  .missing {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 10px;
    word-break: break-all;
  }
  .download-btn {
    display: none;
    margin-top: 16px;
    padding: 14px 28px;
    background: var(--accent);
    color: #0d1117;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.95rem;
  }
  .status { font-size: 0.8rem; color: var(--muted); text-align: center; margin-top: 12px; max-width: 420px; }
</style>
</head>
<body>

<h1>QR File Receiver</h1>
<div class="sub">Camera se sender phone ke animated QR codes scan karo.<br>File apne aap reassemble ho jayegi.</div>

<button class="start-btn" id="startBtn">📷 Camera Open Karo</button>

<div id="video-wrap">
  <video id="video" playsinline autoplay muted></video>
  <div class="scan-frame"></div>
</div>
<canvas id="canvas"></canvas>

<div class="panel" id="infoPanel">
  <div class="row"><span>File</span><span class="val" id="fName">—</span></div>
  <div class="row"><span>Chunks received</span><span class="val" id="chunkStatus">0 / 0</span></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>

<a id="downloadBtn" class="download-btn" download>⬇ File Download Karo</a>

<div class="status" id="statusMsg"></div>

<script>
const startBtn = document.getElementById('startBtn');
const videoWrap = document.getElementById('video-wrap');
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const infoPanel = document.getElementById('infoPanel');
const fName = document.getElementById('fName');
const chunkStatus = document.getElementById('chunkStatus');
const progressFill = document.getElementById('progressFill');
const downloadBtn = document.getElementById('downloadBtn');
const statusMsg = document.getElementById('statusMsg');

let meta = null; // {id, totalChunks, name, mime}
let chunks = new Map(); // index -> base64 string
let scanning = false;
let rafId = null;

startBtn.onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    video.srcObject = stream;
    videoWrap.style.display = 'block';
    startBtn.style.display = 'none';
    scanning = true;
    statusMsg.textContent = 'QR code ko frame ke andar rakho...';
    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      tick();
    };
  } catch (err) {
    statusMsg.textContent = 'Camera access nahi mil paya: ' + err.message;
  }
};

function tick() {
  if (!scanning) return;
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height, {
      inversionAttempts: 'dontInvert'
    });
    if (code && code.data) {
      handleFrame(code.data);
    }
  }
  rafId = requestAnimationFrame(tick);
}

function handleFrame(data) {
  const parts = data.split('|');
  if (parts[0] === 'M') {
    const [, id, totalChunks, name, mime] = parts;
    if (!meta || meta.id !== id) {
      meta = { id, totalChunks: parseInt(totalChunks, 10), name: decodeURIComponent(name), mime };
      chunks = new Map();
      infoPanel.style.display = 'block';
      fName.textContent = meta.name;
      updateProgress();
    }
  } else if (parts[0] === 'D') {
    const [, id, idxStr, totalStr, chunkData] = parts;
    if (!meta) {
      // data frame arrived before meta frame — create provisional meta
      meta = { id, totalChunks: parseInt(totalStr, 10), name: 'received_file', mime: 'application/octet-stream' };
      infoPanel.style.display = 'block';
      fName.textContent = meta.name;
    }
    if (meta.id !== id) return; // frame from a different transfer, ignore
    const idx = parseInt(idxStr, 10);
    if (!chunks.has(idx)) {
      chunks.set(idx, chunkData);
      updateProgress();
    }
  }

  if (meta && chunks.size === meta.totalChunks) {
    finishTransfer();
  }
}

function updateProgress() {
  if (!meta) return;
  chunkStatus.textContent = `${chunks.size} / ${meta.totalChunks}`;
  progressFill.style.width = `${(chunks.size / meta.totalChunks) * 100}%`;
}

function finishTransfer() {
  scanning = false;
  if (rafId) cancelAnimationFrame(rafId);
  const stream = video.srcObject;
  if (stream) stream.getTracks().forEach(t => t.stop());
  videoWrap.style.display = 'none';

  let base64 = '';
  for (let i = 0; i < meta.totalChunks; i++) {
    base64 += chunks.get(i) || '';
  }

  try {
    const byteChars = atob(base64);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], { type: meta.mime });
    const url = URL.createObjectURL(blob);
    downloadBtn.href = url;
    downloadBtn.download = meta.name;
    downloadBtn.style.display = 'inline-block';
    statusMsg.textContent = '✅ File poori tarah receive ho gayi!';
  } catch (e) {
    statusMsg.textContent = 'Reassemble karte waqt error aayi: ' + e.message;
  }
}
</script>

</body>
</html>
